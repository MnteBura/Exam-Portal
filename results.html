<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exam Results | Exam Portal</title>

    <link rel="stylesheet"
          href="results.css">

</head>


<body>


    <main class="results-container">


        <!-- HEADER -->

        <div class="results-header">

            <div class="brand">

                <div class="brand-logo">
                    EP
                </div>

                <span>
                    Exam Portal
                </span>

            </div>

        </div>


        <!-- RESULT CARD -->

        <section class="results-card">


            <div class="success-icon">
                ✓
            </div>


            <p class="small-title">
                EXAMINATION COMPLETED
            </p>


            <h1>
                Examination Results
            </h1>


            <p class="subtitle">
                Your examination has been successfully submitted.
            </p>


            <!-- SCORE -->

            <div class="score-circle">

                <div>

                    <strong id="score">
                        0
                    </strong>

                    <span>
                        %
                    </span>

                </div>

            </div>


            <h2 id="performance">
                Good Job!
            </h2>


            <p id="scoreText"
               class="score-text">
                You completed the examination.
            </p>


            <!-- STATISTICS -->

            <div class="result-stats">


                <div class="result-stat">

                    <div class="stat-icon correct">
                        ✓
                    </div>

                    <span>
                        Correct
                    </span>

                    <strong id="correct">
                        0
                    </strong>

                </div>


                <div class="result-stat">

                    <div class="stat-icon incorrect">
                        ✕
                    </div>

                    <span>
                        Incorrect
                    </span>

                    <strong id="incorrect">
                        0
                    </strong>

                </div>


                <div class="result-stat">

                    <div class="stat-icon unanswered">
                        !
                    </div>

                    <span>
                        Unanswered
                    </span>

                    <strong id="unanswered">
                        0
                    </strong>

                </div>


                <div class="result-stat">

                    <div class="stat-icon flagged">
                        ⚑
                    </div>

                    <span>
                        Flagged
                    </span>

                    <strong id="flagged">
                        0
                    </strong>

                </div>


            </div>


            <!-- SCORE DETAILS -->

            <div class="score-details">

                <div>

                    <span>
                        Final Score
                    </span>

                    <strong id="finalScore">
                        0 / 0
                    </strong>

                </div>


                <div>

                    <span>
                        Percentage
                    </span>

                    <strong id="percentage">
                        0%
                    </strong>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="result-actions">

                <button
                    id="retakeButton"
                    class="secondary-button">

                    ↻ Retake Exam

                </button>


                <button
                    id="dashboardButton"
                    class="primary-button">

                    Back to Dashboard →

                </button>

            </div>


        </section>


        <footer>

            © 2026 Exam Portal • Secure Examination System

        </footer>


    </main>


    <script src="results.js"></script>

</body>

</html>
